[package]
name = "localreel-plugin-cli"
version = "0.3.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
description = "Scaffold, validate and pack LocalReel sidecar plugins"
repository = "https://github.com/LocalReel/localreel-plugin-cli"
publish = false

[[bin]]
name = "localreel-plugin-cli"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
