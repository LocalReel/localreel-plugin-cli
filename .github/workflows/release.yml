name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x64
            archive: localreel-plugin-cli-windows-x64.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
            archive: localreel-plugin-cli-linux-x64.tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            platform: linux-arm64
            archive: localreel-plugin-cli-linux-arm64.tar.gz
          - os: macos-14
            target: x86_64-apple-darwin
            platform: macos-x64
            archive: localreel-plugin-cli-macos-x64.tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            platform: macos-arm64
            archive: localreel-plugin-cli-macos-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    env:
      PLATFORM: ${{ matrix.platform }}
      ARCHIVE: ${{ matrix.archive }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install the arm64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "localreel-plugin-cli-${{ github.ref_name }}-${{ matrix.platform }}"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/localreel-plugin-cli.exe" $stage
          Copy-Item README.md, LICENSE $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "$env:ARCHIVE"

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          stage="localreel-plugin-cli-${GITHUB_REF_NAME}-${PLATFORM}"
          mkdir -p "$stage"
          cp "target/${TARGET}/release/localreel-plugin-cli" "$stage/"
          cp README.md LICENSE "$stage/"
          tar -czf "$ARCHIVE" "$stage"

      - name: Checksum
        shell: bash
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          else
            shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          fi
          cat "$ARCHIVE.sha256"

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          body: |
            Prebuilt binaries for `localreel-plugin-cli`.

            - Windows x64
            - Linux x64 / arm64
            - macOS x64 / arm64

            Each archive contains the CLI, the README and the license. Verify the
            download with the matching `.sha256` file.

            Building a generated plugin still needs the Rust toolchain.
          files: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256
